databaseChangeLog:
  - changeSet:
      id: 001-create-app-user
      author: recommender-service
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-user-profile
      author: recommender-service
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: user_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_profile_user
                    references: app_user(id)
              - column:
                  name: height_cm
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: weight_kg
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: birth_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: varchar(32)
              - column:
                  name: activity_level
                  type: varchar(32)
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
